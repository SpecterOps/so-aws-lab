# Lab catalog. The `so-aws-lab` TUI reads this to render the toggle list.
# `slug` matches the Terraform `enable_<slug>` variable.

labs:
  - slug: createpolicyversion
    title: IAM CreatePolicyVersion
    category: IAM
    technique: Swap default version of a managed policy attached to the entry role
    has_victim: false
    services: [iam]
    cost: "free"
    daily_usd: 0.0
    accounts: [dev]

  - slug: assumerole
    title: IAM AssumeRole
    category: IAM
    technique: Discover that the lab target trusts the entry role directly
    has_victim: false
    services: [iam, sts]
    cost: "free"
    daily_usd: 0.0
    accounts: [dev]

  - slug: putuserpolicy
    title: IAM PutUserPolicy
    category: IAM
    technique: Put an inline policy on a victim user, mint keys, assume target as victim
    has_victim: true
    services: [iam]
    cost: "free"
    daily_usd: 0.0
    accounts: [dev]

  - slug: attachrolepolicy
    title: IAM AttachRolePolicy
    category: IAM
    technique: Attach a sleeper managed policy to your own entry role
    has_victim: false
    services: [iam]
    cost: "free"
    daily_usd: 0.0
    accounts: [dev]

  - slug: createcredentials
    title: IAM CreateAccessKey
    category: IAM
    technique: Mint keys for the lab's victim user, assume target as victim
    has_victim: true
    services: [iam]
    cost: "free"
    daily_usd: 0.0
    accounts: [dev]

  - slug: updateassumerolepolicy
    title: IAM UpdateAssumeRolePolicy
    category: IAM
