    has_victim: false
    services: [iam]
    cost: "free"
    daily_usd: 0.0
    accounts: [dev]

  - slug: ec2runinstances
    title: EC2 RunInstances + PassRole
    category: EC2
    technique: Launch an EC2 with a privileged instance profile, steal IMDS creds
    has_victim: false
    services: [ec2, iam]
    cost: "~$0.01 per run (t3.micro/hr)"
    daily_usd: 0.0
    accounts: [dev]

  - slug: ec2modifyuserdata
    title: EC2 ModifyInstanceAttribute (userdata)
