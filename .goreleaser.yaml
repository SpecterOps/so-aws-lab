version: 2

project_name: so-aws-lab

before:
  hooks:
    - go mod tidy
    - go test ./...
    # Refresh dependency notices so a release can never ship a stale set. The
    # script fails the build if any linked module has no license file.
    - sh scripts/gen-third-party.sh

builds:
  - id: so-aws-lab
    main: ./cmd/so-aws-lab
    binary: so-aws-lab
    # Pure Go — no cgo anywhere in the dep tree, so every target cross-compiles
    # from the release runner with no C toolchain.
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    # Deliberately no version in the name: install.sh builds this filename from
    # (os, arch) alone. GoReleaser strips the leading "v" from .Version, which
    # is a classic source of 404s in install scripts — this sidesteps it.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # LICENSE and THIRD_PARTY_NOTICES.md are not optional extras: MIT and BSD
    # both require their notices to accompany redistributed copies, and the
    # binary in this archive statically links that dependency code.
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/specterops/so-aws-lab/main/install.sh | sh
    ```

    Requires `terraform` and the `aws` CLI on your `$PATH`.

